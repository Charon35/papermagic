<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>PaperMagic — реклама набору «Миколай і Новий рік»</title>
<link rel="stylesheet" href="../../instagram/src/fonts.css">
<link rel="stylesheet" href="../tools/kit.css">
<style>
.snow{position:absolute;color:#c9d6ff;font-weight:900}
</style>
</head>
<body>
<div id="stage"></div>
<script src="../../instagram/src/figs.js"></script>
<script src="../tools/kit.js"></script>
<script>
// Набір «Миколай і Новий рік»: 299 ₴ замість 386 ₴ (89+99+99+99). Тривалість 12 с; тексти в межах y 250–1570.
const SET = ['truck', 'cupcake', 'dog', 'police'];

let html = '';

// сніжинки на тлі — повільно падають увесь ролик
for (let i = 0; i < 14; i++) {
  const x = (i * 263) % 1040, y = ((i * 397 + T * (40 + i % 4 * 12)) % 1900) - 40;
  html += `<div class="snow" style="left:${x}px;top:${y}px;font-size:${34 + i % 3 * 18}px;transform:rotate(${T * 20 + i * 30}deg)">✻</div>`;
}

// 1. Хук (0–3 с): подушка, з-під якої визирають фігурки
{
  const o = vis0(3.1, .3);
  if (o > 0) {
    html += `<div class="abs h" style="top:370px;font-size:112px;opacity:${o}">Подарунок<br><span class="hl">під подушку</span></div>`;
    html += `<div class="abs h" style="top:625px;font-size:62px;font-weight:800;opacity:${o}">який дитина зробить сама ✂️</div>`;
    // фігурки «виглядають» з-за подушки
    const pos = [[-10, 760, -6], [260, 720, 2], [540, 740, -3], [770, 770, 6]];
    SET.forEach((id, i) => {
      const k = ease(.5 + (T - i * .15) / .6);
      const [x, y, r] = pos[i];
      html += fig(id, x, y + (1 - k) * 120, 340, 1, o, `transform:rotate(${r}deg)`);
    });
    // подушка
    html += `<div class="abs" style="left:40px;top:1010px;width:1000px;height:420px;opacity:${o}">
      <svg viewBox="0 0 1000 420" width="100%" height="100%"><path d="M40 70 Q500 10 960 70 Q1000 210 960 350 Q500 410 40 350 Q0 210 40 70 Z" fill="#efe9ff" stroke="#2a2440" stroke-width="8" stroke-linejoin="round"/>
      <path d="M120 120 Q500 80 880 120 M120 300 Q500 340 880 300" fill="none" stroke="#c9bdfc" stroke-width="6" stroke-dasharray="18 16"/></svg></div>`;
    html += `<div class="abs" style="left:0;right:0;top:1180px;text-align:center;opacity:${o * fade(.5, .9)}"><span class="pill" style="background:var(--coral);color:#fff;font-size:52px;padding:20px 44px">🎁 До Миколая — 6 грудня</span></div>`;
  }
}

// 2. Аркуш → фігурка (3–7.2 с)
{
  const o = vis(3, 7.2);
  if (o > 0) {
    const k = ease((T - 3) / .6);
    html += `<div class="abs h" style="top:370px;font-size:80px;opacity:${o}">Роздрукуй, розмалюй<br>і <span class="hl">склей</span></div>`;
    html += `<div class="abs card" style="left:${80 + (1 - k) * 80}px;top:600px;width:820px;padding:20px;opacity:${o};transform:rotate(${-2 + k}deg)"><img src="${sheet('truck')}" style="width:100%;height:880px;object-fit:cover;object-position:top;border-radius:18px"></div>`;
    const g = pop((T - 4.4) / .6);
    html += fig('truck', 500, 1020, 540, g, o, 'filter:drop-shadow(0 24px 30px rgba(42,36,64,.25))');
    html += `<div class="abs" style="left:90px;top:1330px;opacity:${fade(5, 5.4) * o}"><span class="pill" style="background:var(--violet);color:#fff;font-size:44px;padding:20px 36px">Вантажівка везе подарунки 🎄</span></div>`;
    html += `<div class="abs" style="left:90px;top:1440px;opacity:${fade(5.6, 6) * o}"><span class="pill" style="background:#fff;font-size:40px;padding:18px 32px;box-shadow:0 10px 30px rgba(42,36,64,.12)">⏱ Творчість без екрана на канікули</span></div>`;
  }
}

// 3. Чотири фігурки з назвами (7.2–9.6 с)
{
  const o = vis(7.2, 9.6);
  if (o > 0) {
    html += `<div class="abs h" style="top:380px;font-size:84px;opacity:${o}"><span class="hl">4 фігурки</span> в наборі</div>`;
    const pos = [[60, 530], [560, 530], [60, 1000], [560, 1000]];
    SET.forEach((id, i) => {
      const s = ease((T - 7.3 - i * .12) / .4);
      const [x, y] = pos[i];
      html += `<div class="abs card" style="left:${x}px;top:${y}px;width:460px;height:430px;background:${BG[id]};opacity:${o * s};transform:scale(${.9 + .1 * s})">
        ${fig(id, 30, 20, 400)}
        <div style="position:absolute;left:10px;right:10px;bottom:28px;text-align:center;font-weight:900;font-size:36px;line-height:1.1">${SITE[id][0]}</div></div>`;
    });
  }
}

// 4. Ціна й заклик (9.6–12 с)
{
  const o = fade(9.6, 10);
  if (o > 0) {
    html += `<div class="abs h" style="top:370px;font-size:70px;opacity:${o}">Набір «Миколай<br>і Новий рік»</div>`;
    SET.forEach((id, i) => html += fig(id, 0 + i * 262, 550, 280, pop((T - 9.7 - i * .08) / .4), o));
    const p = pop((T - 10.1) / .5);
    html += `<div class="abs card" style="left:140px;top:820px;width:800px;padding:40px 40px 46px;text-align:center;opacity:${o};transform:scale(${p || 0.001})">
      <div style="font-size:56px;font-weight:800;color:var(--muted)">4 фігурки · <s>386 ₴</s></div>
      <div style="font-size:190px;font-weight:900;line-height:1.05;color:var(--violet)">299 ₴</div>
      <span class="pill" style="background:var(--coral);color:#fff;font-size:44px;padding:14px 32px">вигода 87 ₴</span></div>`;
    html += `<div class="abs h" style="top:1290px;font-size:46px;font-weight:800;opacity:${fade(10.5, 10.9)}">PDF одразу на e-mail — встигнете<br>роздрукувати до 6 грудня 🖨</div>`;
    html += `<div class="abs" style="left:0;right:0;top:1440px;text-align:center;opacity:${fade(10.8, 11.2)}"><span class="pill" style="background:var(--ink);color:#fff;font-size:50px;padding:24px 50px">Замовляй на сайті 👇</span></div>`;
  }
}

html += logo();
document.getElementById('stage').innerHTML = html;
</script>
</body>
</html>
