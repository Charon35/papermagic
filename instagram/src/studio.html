<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>PaperMagic studio</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{--violet:#6a4cf0;--violet-l:#efe9ff;--sun:#ffc93c;--ink:#2a2440;--cream:#fffaf3;--coral:#ff6b5b;--mint:#5fd3b5;--muted:#6b6580}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow:hidden;background:#fff}
body{font-family:Nunito,sans-serif;color:var(--ink)}
#stage{position:relative;overflow:hidden;background:var(--cream)}
.abs{position:absolute}
.h{font-weight:900;line-height:1.04;letter-spacing:-.015em}
.hl{background:linear-gradient(transparent 60%,var(--sun) 60%);padding:0 10px;margin:0 -10px}
.pill{display:inline-flex;align-items:center;gap:14px;border-radius:999px;font-weight:900;white-space:nowrap}
.paper{background:#fff;border-radius:16px;box-shadow:0 30px 60px rgba(42,36,64,.18);padding:14px}
.paper .in{position:relative}
.paper img{display:block;width:100%}
.paint{position:absolute;inset:0;mix-blend-mode:multiply}
.fig svg{width:100%;height:auto;display:block;overflow:visible}
.cap{left:60px;right:60px;text-align:center}
.cap>div{display:inline-block;background:#fff;border-radius:34px;padding:26px 40px;font-weight:900;font-size:76px;line-height:1.08;box-shadow:0 14px 40px rgba(42,36,64,.12)}
.num{width:150px;height:150px;border-radius:50%;background:var(--sun);display:grid;place-items:center;font-weight:900;font-size:86px}
.bubble{max-width:520px;padding:22px 28px;border-radius:30px;font-size:34px;font-weight:700;line-height:1.25}
</style>
</head>
<body>
<div id="stage"></div>
<script src="figs.js"></script>
<script>
const IMG = '../../papermagic-site/img/';
const PRODUCTS = [
  {id:'police',  name:'Поліцейське авто',        sheet:3, price:99, diff:'Легко',    time:'30–40 хв', paint:['#3b82ff','#ff4b4b','#ffd23f','#cfe8ff']},
  {id:'racer',   name:'Гоночна «Блискавка 95»',  sheet:8, price:99, diff:'Середньо', time:'40–50 хв', paint:['#ff3b30','#ffd23f','#ff7a59','#ffe0d6']},
  {id:'shark',   name:'Весела акула',            sheet:5, price:89,  diff:'Легко',    time:'25–35 хв', paint:['#4f8ed8','#8fd0ff','#ff8fa3','#dff1ff']},
  {id:'cupcake', name:'Фудтрак «Кекс»',          sheet:2, price:99, diff:'Складно',  time:'50–60 хв', paint:['#ff8fbf','#7fdcc8','#a0673f','#fff0c2']},
  {id:'hippie',  name:'Хіпі-фургон',             sheet:1, price:99, diff:'Середньо', time:'40–50 хв', paint:['#4cc3c8','#a5d649','#ff8a3d','#e2f7f4']},
  {id:'bus',     name:'Мікроавтобус «Жабенята»', sheet:7, price:99, diff:'Середньо', time:'40–50 хв', paint:['#ffcf3f','#57b947','#9fd8ff','#fff4c2']},
  {id:'truck',   name:'Вантажівка PaperMagic',   sheet:6, price:89, diff:'Легко',    time:'30–40 хв', paint:['#ef5148','#ffd84d','#6a4cf0','#fff1d6']},
  {id:'dog',     name:'Песик Шнауцер',           sheet:4, price:99, diff:'Середньо', time:'40–50 хв', paint:['#9fa9c4','#ff5b6e','#f4d9a8','#eef0f6']},
];
const byId = id => PRODUCTS.find(p=>p.id===id);
const fig = id => FIGS[id]();

const Q = new URLSearchParams(location.search);
const kind = Q.get('kind'), id = Q.get('id'), slide = +(Q.get('slide')||0), T = +(Q.get('t')||0);
const SIZE = {post:[1080,1350], reel:[1080,1920], hl:[1080,1920], avatar:[1080,1080]}[kind];
const W = SIZE[0], H = SIZE[1];

const clamp = (x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const prog = (t,a,b)=>clamp((t-a)/(b-a));
const eOut = x=>1-Math.pow(1-x,3);
const eBack = x=>{ const c1=1.9, c3=c1+1; return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2); };
const box = (style, html='') => `<div class="abs" style="${style}">${html}</div>`;
const figAt = (fid, left, top, w, extra='') => box(`left:${left}px;top:${top}px;width:${w}px;${extra}`, `<div class="fig">${fig(fid)}</div>`);

const LOGO = (c='#2a2440') => `<svg viewBox="0 0 900 860" width="100%" height="100%"><g fill="none" stroke="${c}" stroke-width="24" stroke-linejoin="round" stroke-linecap="round"><path d="M195 165 L248 525 M195 165 L560 528"/><path d="M25 428 L330 578 M25 428 L305 738 L440 708"/><path d="M290 615 L445 465 L655 628 L650 838 L290 615 Z M290 615 L305 738"/><path d="M445 465 Q470 600 515 640 Q590 740 645 828" stroke-width="12"/><path d="M560 545 L712 290 L772 292 L655 628 M772 292 L860 405 L752 362"/></g><g fill="${c}"><path d="M453 20 Q467.0 76.0 523 90 Q467.0 104.0 453 160 Q439.0 104.0 383 90 Q439.0 76.0 453 20 Z"/><path d="M648 158 Q657.4 195.6 695 205 Q657.4 214.4 648 252 Q638.6 214.4 601 205 Q638.6 195.6 648 158 Z"/><path d="M523 270 Q531.0 302.0 563 310 Q531.0 318.0 523 350 Q515.0 318.0 483 310 Q515.0 302.0 523 270 Z"/><path d="M825 538 Q836.4 583.6 882 595 Q836.4 606.4 825 652 Q813.6 606.4 768 595 Q813.6 583.6 825 538 Z"/></g></svg>`;
const brand = (left, top, size=64, c='#2a2440', s='#6a4cf0') => box(`left:${left}px;top:${top}px;display:flex;align-items:center;gap:14px;font-weight:900;font-size:${size*0.7}px;color:${c}`, `<div style="width:${size}px;height:${size}px">${LOGO(c,s)}</div>PaperMagic`);

// paper sheet; paint = 0..1 how much of it is "coloured in" (left-to-right wipe)
function sheet(p, w, paint=0){
  const [a,b,c,d] = p.paint;
  const g = `radial-gradient(circle at 28% 22%, ${a} 0, transparent 34%), radial-gradient(circle at 72% 38%, ${b} 0, transparent 36%), radial-gradient(circle at 35% 66%, ${c} 0, transparent 34%), radial-gradient(circle at 70% 82%, ${a} 0, transparent 30%), ${d}`;
  const paintLayer = paint>0 ? `<div class="paint" style="background:${g};clip-path:inset(0 ${(100-paint*100).toFixed(2)}% 0 0)"></div>` : '';
  return `<div class="paper" style="width:${w}px"><div class="in"><img src="${IMG}sheet-${p.sheet}.jpg">${paintLayer}</div></div>`;
}
const pricePill = (p, size=64) => p.price ? `<span class="pill" style="background:var(--violet);color:#fff;font-size:${size}px;padding:${size*.22}px ${size*.5}px">${p.price} ₴</span>` : `<span class="pill" style="background:var(--coral);color:#fff;font-size:${size}px;padding:${size*.22}px ${size*.5}px">0 ₴ 🎁</span>`;
const handlePill = (size=40, bg='#fff', fg='var(--ink)') => `<span class="pill" style="background:${bg};color:${fg};font-size:${size}px;padding:${size*.4}px ${size*.8}px;box-shadow:0 10px 30px rgba(42,36,64,.12)">🔗 Посилання в профілі · @papermagic_ua</span>`;

/* ================= posts (1080×1350) ================= */
const POSTS = {

      + box('left:80px;top:560px;font-size:42px;font-weight:800;color:var(--muted)', 'Роздрукуй · Розмалюй · Виріж · Склей')

      + box('left:80px;top:560px;width:900px;font-size:46px;font-weight:800;color:#fff;opacity:.92', '4 простих кроки — і дитина має нову іграшку, зроблену власноруч')
      + box('left:160px;top:760px;width:820px;height:520px;border-radius:50%;background:rgba(255,255,255,.14)')
      + figAt('racer', 150, 730, 820)

      ['Роздрукуй','PDF на звичайному А4: вдома, у школі чи в копіцентрі.'],
      ['Розмалюй','Олівцями, фломастерами чи фарбами. Кольори обирає дитина.'],
      ['Виріж і склей','Вирізаєте по контуру, згинаєте по пунктиру — готово!'],
    ];
    const [title, text] = steps[slide-1], P = byId('police');
    let visual = '';
    if (slide===1) visual = box('left:150px;top:520px;width:780px;height:740px;background:#fff;border-radius:44px;box-shadow:0 30px 60px rgba(42,36,64,.14);padding:40px;display:flex;flex-direction:column;gap:22px',
        `<div style="display:flex;gap:24px;align-items:center;background:var(--cream);border-radius:28px;padding:16px">
           <div style="width:190px;height:150px;border-radius:22px;background:${BG.police};padding:8px;display:grid;place-items:center"><div class="fig" style="width:100%">${fig('police')}</div></div>
           <div><div style="font-size:40px;font-weight:900;line-height:1.1">Поліцейське авто</div><div style="font-size:34px;font-weight:800;color:var(--muted);margin-top:6px">99 ₴ · PDF</div></div></div>
         <div style="font-size:30px;font-weight:800">E-mail, на який надіслати PDF</div>

    if (slide===4) visual = box('left:50px;top:620px;transform:rotate(-8deg)', sheet(P, 330, 1)) + box('left:380px;top:820px;font-size:90px;font-weight:900;color:var(--violet)', '→') + figAt('police', 440, 600, 600);
    return box('inset:0;background:var(--cream)')
      + box('left:80px;top:80px', `<div class="num">${slide}</div>`)
      + box('left:80px;top:265px;font-size:100px', `<div class="h">${title}</div>`)
      + box('left:80px;top:390px;width:920px;font-size:42px;font-weight:700;color:var(--muted);line-height:1.3', text)
      + visual
      + (slide===4 ? box('left:80px;top:1236px', handlePill(36)) : box('right:60px;top:110px;font-size:36px;font-weight:900;color:var(--muted)', `${slide+1}/5`));
  },
  catalog(){
    if (slide===0){
      let cells = '';
      PRODUCTS.forEach((p,i)=>{ const x = 60 + (i%4)*245, y = 640 + Math.floor(i/4)*290;
        cells += box(`left:${x}px;top:${y}px;width:225px;height:270px;border-radius:30px;background:${BG[p.id]};padding:14px;display:flex;flex-direction:column;justify-content:center`, `<div class="fig">${fig(p.id)}</div>`); });
      return box('inset:0;background:var(--cream)') + brand(80,70)
        + box('left:80px;top:190px;font-size:120px', `<div class="h">Обери свою<br>фігурку 👇</div>`)
        + box('left:80px;top:470px;font-size:46px;font-weight:800;color:var(--muted)', '8 моделей · від 89 ₴ · PDF на А4')
        + cells + box('left:80px;top:1236px', handlePill(36));
    }
    const p = PRODUCTS[slide-1];
    return box(`inset:0;background:${BG[p.id]}`)
      + box('left:80px;top:80px', `<span class="pill" style="background:#fff;font-size:34px;padding:10px 24px">${slide}/8</span>`)
      + box('left:80px;top:170px;width:940px;font-size:86px', `<div class="h">${p.name}</div>`)
      + box('left:80px;top:'+(p.name.length>20?370:290)+'px;font-size:40px;font-weight:800;color:var(--muted)', `⏱ ${p.time} · ✂️ ${p.diff}`)
      + figAt(p.id, 60, 400, 960)
      + box('left:790px;top:1000px;transform:rotate(7deg)', sheet(p, 210))
      + box('left:80px;top:1200px', pricePill(p, 64))
      + box('left:330px;top:1222px;font-size:40px;font-weight:900', 'Купити — в профілі 👆');
  },
  bundle(){
    const full = PRODUCTS.reduce((t,p)=>t+p.price,0);
    let cells = '';
    PRODUCTS.forEach((p,i)=>{ const x = 60 + (i%4)*245, y = 600 + Math.floor(i/4)*270;
      cells += box(`left:${x}px;top:${y}px;width:225px;height:250px;border-radius:30px;background:${BG[p.id]};padding:14px;display:flex;flex-direction:column;justify-content:center`, `<div class="fig">${fig(p.id)}</div>`); });
    return box('inset:0;background:var(--violet)') + brand(80,70,64,'#fff','#ffc93c')
      + box('left:80px;top:190px;font-size:116px;color:#fff', `<div class="h">Увесь набір —<br>8 фігурок 🎁</div>`)
      + box('left:80px;top:460px;width:920px;font-size:44px;font-weight:800;color:#fff;opacity:.92', 'Усі розмальовки одним PDF: на тиждень творчості або на дитяче свято')
      + cells
      + box('left:80px;top:1180px;display:flex;align-items:center;gap:26px', `<span class="pill" style="background:var(--sun);color:var(--ink);font-size:84px;padding:14px 40px">449 ₴</span><span style="font-size:52px;font-weight:800;color:#fff;opacity:.75;text-decoration:line-through">${full} ₴</span>`)
      + box('right:70px;top:1222px;font-size:36px;font-weight:900;color:#fff', 'Купити — в профілі 👆');
  }
};

/* ================= highlight covers & avatar ================= */
const HL = {
  catalog: ['fig','police'], order: ['emoji','💬'], bundle: ['emoji','🎁'], process: ['emoji','✂️'], reviews: ['emoji','⭐'],
};
function highlight(){
  const [type, v] = HL[id];
  const inner = type==='fig' ? box('left:220px;top:690px;width:640px', `<div class="fig">${fig(v)}</div>`) : box('left:0;right:0;top:700px;text-align:center;font-size:400px;line-height:520px', v);
  return box('inset:0;background:var(--violet)') + box('left:160px;top:580px;width:760px;height:760px;border-radius:50%;background:#fff') + inner;
}
function avatar(){
  return box('inset:0;background:var(--violet)') + box('left:190px;top:190px;width:700px;height:700px', LOGO('#fff','#ffc93c'));
}

/* ================= reels (1080×1920) ================= */
const caption = (html, t, a, b, top=230) => {
  const pin = eBack(prog(t, a, a+0.3)), pout = prog(t, b-0.18, b);
  if (t < a || t > b) return '';
  return box(`top:${top}px;opacity:${1-pout};transform:scale(${(0.6+0.4*pin)*(1-0.1*pout)})`, `<div>${html}</div>`).replace('class="abs"','class="abs cap"');
};
const confetti = (cx, cy, p) => {
  if (p<=0 || p>=1) return '';
  const cols = ['#ffc93c','#ff6b5b','#5fd3b5','#6a4cf0','#5aa9f5'];
  let s = '';
  for (let i=0;i<28;i++){ const a = i/28*Math.PI*2 + i, r = 120 + 420*eOut(p)*(0.6+0.4*((i*37)%10)/10);
    s += box(`left:${cx+Math.cos(a)*r-12}px;top:${cy+Math.sin(a)*r+260*p*p-12}px;width:24px;height:${i%2?24:12}px;border-radius:${i%3?6:12}px;background:${cols[i%5]};opacity:${1-p};transform:rotate(${i*40+p*300}deg)`); }
  return s;
};

// "аркуш → іграшка" reel; steps timings in seconds
function sheetReel(p, o){
  const t = T, SW = 620, SL = (W-SW)/2, ST = 620, SH = SW*842/595 + 28;
  let s = box('inset:0;background:var(--cream)') + box(`left:60px;top:560px;width:960px;height:1060px;border-radius:50%;background:${BG[p.id]}`);
  s += brand(330, 110, 60);
  // hook: finished figure
  if (t < o.print + 0.3){
    const k = eBack(prog(t, 0.15, 0.75)) * (1 - eOut(prog(t, o.print, o.print+0.3)));
    s += figAt(p.id, 90, 760 + Math.sin(t*3)*14, 900, `transform:scale(${k})`);
  }
  // sheet in / painting / cutting
  if (t >= o.print && t < o.glue + 0.4){
    const up = eOut(prog(t, o.print, o.print+0.6)), out = eOut(prog(t, o.glue, o.glue+0.4));
    const paint = prog(t, o.paint+0.1, o.cut ? o.cut-0.2 : o.glue-0.2);
    s += box(`left:${SL}px;top:${ST + (1-up)*1300}px;transform:rotate(${-3+3*up}deg) scale(${1-0.7*out});opacity:${1-out}`, sheet(p, SW, eOut(paint)));
    if (t >= o.paint && t < (o.cut||o.glue)){
      const x = SL + SW*eOut(paint), y = ST + 200 + Math.sin(t*9)*260 + 260;
      s += box(`left:${x-70}px;top:${y}px;font-size:150px;transform:rotate(-25deg)`, '🖍️');
    }
    if (o.cut && t >= o.cut && t < o.glue){
      const c = prog(t, o.cut+0.1, o.glue-0.1), per = 2*(SW+SH+40);
      s += `<svg class="abs" style="left:${SL-20}px;top:${ST-20}px" width="${SW+40}" height="${SH+40}"><rect x="4" y="4" width="${SW+32}" height="${SH+32}" rx="24" fill="none" stroke="#2a2440" stroke-width="6" stroke-dasharray="18 14" pathLength="${per}" style="stroke-dashoffset:0" /><rect x="4" y="4" width="${SW+32}" height="${SH+32}" rx="24" fill="none" stroke="#fffaf3" stroke-width="10" pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="${-1000*c}"/></svg>`;
      // scissors travel along the perimeter
      const d = c*per, wv = SW+40, hv = SH+40; let sx, sy;
      if (d < wv){ sx = d; sy = 0; } else if (d < wv+hv){ sx = wv; sy = d-wv; } else if (d < 2*wv+hv){ sx = wv-(d-wv-hv); sy = hv; } else { sx = 0; sy = hv-(d-2*wv-hv); }
      s += box(`left:${SL-20+sx-60}px;top:${ST-20+sy-60}px;font-size:120px`, '✂️');
    }
  }
  // glue → figure pops
  if (t >= o.glue){
    const k = eBack(prog(t, o.glue+0.25, o.glue+0.85)), lift = eOut(prog(t, o.end, o.end+0.5));
    s += figAt(p.id, 90, 760 - lift*120 + Math.sin(t*3)*12, 900, `transform:scale(${k*(1-0.12*lift)})`);
    s += confetti(540, 1100, prog(t, o.glue+0.35, o.glue+1.6));
  }
  // captions
  s += caption(o.hook, t, 0.05, o.print);
  s += caption(o.printTxt, t, o.print, o.paint);
  s += caption('2. Розмалюй 🖍️', t, o.paint, o.cut||o.glue);
  if (o.cut) s += caption('3. Виріж ✂️', t, o.cut, o.glue);
  s += caption(o.glueTxt, t, o.glue, o.end);
  s += caption(o.endTxt, t, o.end, o.total+1);
  if (t >= o.end){
    const k = eBack(prog(t, o.end+0.3, o.end+0.8));
    s += box(`left:0;right:0;top:1440px;text-align:center;transform:scale(${k})`, pricePill(p, 72));
    s += box(`left:0;right:0;top:1580px;text-align:center;opacity:${prog(t,o.end+0.5,o.end+0.9)}`, handlePill(40));
  }
  return s;
}

const REELS = {
  police: { dur: 12.5, render(){ return sheetReel(byId('police'), {
    hook:'Розмальовка, яка<br>стає 3D-іграшкою 😮', print:2.0, printTxt:'1. Роздрукуй 🖨️', paint:4.0, cut:6.5, glue:8.5,
    glueTxt:'4. Склей — і готово! 🎉', end:10.5, endTxt:'Купуй за посиланням<br>у профілі 👆', total:12.5 }); } },
  shark: { dur: 9.5, render(){ return sheetReel(byId('shark'), {
    hook:'Розмальовка, з якої<br>виходить акула 🦈', print:1.8, printTxt:'1. Роздрукуй 🖨️', paint:3.6, cut:0, glue:5.6,
    glueTxt:'3. Виріж і склей 🦈', end:7.4, endTxt:'Купуй за посиланням<br>у профілі 👆', total:9.5 }); } },
  catalog: { dur: 10.4, render(){
    const t = T, seg = 0.85, start = 1.4, endAt = start + seg*8;
    let s;
    if (t < start){
      s = box('inset:0;background:var(--cream)') + brand(330,110,60);
      PRODUCTS.forEach((p,i)=>{ const k = eBack(prog(t, 0.1+i*0.08, 0.5+i*0.08)), x = 70+(i%2)*480, y = 560+Math.floor(i/2)*300;
        s += box(`left:${x}px;top:${y}px;width:460px;height:280px;border-radius:34px;background:${BG[p.id]};padding:16px 60px;transform:scale(${k})`, `<div class="fig">${fig(p.id)}</div>`); });
      s += caption('Яку обере<br>ваша дитина? 🤔', t, 0.05, start);
    } else if (t < endAt){
      const i = Math.floor((t-start)/seg), p = PRODUCTS[i], lt = t - start - i*seg, k = eOut(clamp(lt/0.28));
      s = box(`inset:0;background:${BG[p.id]}`) + brand(330,110,60)
        + box(`left:0;right:0;top:260px;text-align:center;font-size:84px;padding:0 60px;transform:translateY(${(1-k)*-40}px);opacity:${k}`, `<div class="h">${p.name}</div>`)
        + figAt(p.id, 40 + (1-k)*700, 640 + Math.sin(t*4)*10, 1000)
        + box(`left:0;right:0;top:1500px;text-align:center;transform:scale(${eBack(clamp((lt-0.1)/0.3))})`, pricePill(p, 76))
        + box(`right:60px;top:120px`, `<span class="pill" style="background:#fff;font-size:36px;padding:10px 24px">${i+1}/8</span>`);
    } else {
      s = box('inset:0;background:var(--violet)') + brand(330,110,60,'#fff','#ffc93c');
      PRODUCTS.forEach((p,i)=>{ const k = eBack(prog(t, endAt+0.05+i*0.05, endAt+0.4+i*0.05)), x = 90+(i%4)*235, y = 700+Math.floor(i/4)*260;
        s += box(`left:${x}px;top:${y}px;width:215px;height:230px;border-radius:28px;background:${BG[p.id]};padding:12px;display:flex;align-items:center;transform:scale(${k})`, `<div class="fig" style="width:100%">${fig(p.id)}</div>`); });
      s += caption('Обирай за посиланням<br>у профілі 👆', t, endAt, 99);
      s += box(`left:0;right:0;top:1340px;text-align:center;opacity:${prog(t,endAt+0.5,endAt+0.9)}`, handlePill(42));
    }
    return s;
  } },
};

/* ================= render ================= */
const stage = document.getElementById('stage');
stage.style.width = W+'px'; stage.style.height = H+'px';
document.body.style.width = W+'px'; document.body.style.height = H+'px';
stage.innerHTML = kind==='post' ? POSTS[id]() : kind==='hl' ? highlight() : kind==='avatar' ? avatar() : REELS[id].render();
window.REEL_DUR = kind==='reel' ? REELS[id].dur : 0;
</script>
