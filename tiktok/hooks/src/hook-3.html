<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>PaperMagic TikTok — «POV: дитина 40 хв без телефону»</title>
<link rel="stylesheet" href="/instagram/src/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage"></div>
<script src="common.js"></script>
<script>
// Хук 3, 10.6 с: готовий фургон + «POV» → етапи з таймером: розфарбовує → вирізає → склеює → готово → логотип
const P = BUILD + 'parts/';
const SW = 960, SH = SW * 1086 / 1950;      // боковина фургона на екрані
window.SCENE = {
  dur: 10.6,
  preload: [P + 'hip-side-line.png', P + 'hip-side-color.png', P + 'hip-strip-color.png'],
  draw(t) {
    const bgc = ['#bfeee0', '#fff1c9', '#ffe0db', '#e3dcff', '#bfeee0'][t < 1.8 ? 0 : t < 3.6 ? 1 : t < 5.4 ? 2 : t < 7.2 ? 3 : 4];
    let h = `<div style="position:absolute;inset:0;background:${bgc}"></div>
      <div style="position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.55) 0 7px,transparent 8px) 0 ${t * 60}px/90px 90px"></div>`;
    if (t >= 8.6) return h + endCard(t, 8.6, spin('hip', .15 + t / 4, 540, 1400, 1000, pop(seg(t, 8.7, 9.1))));
    const side = (x, y, k, o = '') => `<div style="position:absolute;left:${x}px;top:${y}px;width:${SW}px;height:${SH}px;${o}">
        <img src="${P}hip-side-line.png" style="position:absolute;inset:0;width:100%;height:100%">
        <img src="${P}hip-side-color.png" style="position:absolute;inset:0;width:100%;height:100%;clip-path:inset(0 ${100 - k * 100}% 0 0)"></div>`;
    // таймер: хвилини творчості ростуть від етапу до етапу
    const min = t < 1.8 ? 40 : Math.round(40 * seg(t, 1.8, 7.2));
    const stage = (txt, a) => cap([txt], 520, 74, { scale: pop(seg(t, a, a + .35)), rot: a % 2 ? 2 : -2, bg: 'var(--ink)', fg: '#fff' });

    // 0–1.8 с: готовий фургон уже крутиться + POV
    if (t < 1.8) {
      h += spin('hip', .5 + t / 3, 540, 1060, 1350, 1.05 + .08 * easeIO(t / 1.8));
      h += cap(['POV: дитина', '40 хв без', 'телефону 📵'], 240, 100, { rot: -2, scale: 1 + .04 * Math.sin(t * 7) * (1 - seg(t, 0, 1)) });
      if (t > .9) h += chip('як це було 👇', CX, 1350, 60, { center: true, rot: 3, scale: pop((t - .9) / .35), bg: 'var(--violet)' });
    }
    // 1.8–3.6 с: розфарбовує (контур → колір, олівець)
    else if (t < 3.6) {
      const k = easeIO(seg(t, 2, 3.5));
      h += side(60, 900, k, `transform:rotate(${-3 + Math.sin(t * 8)}deg);filter:drop-shadow(0 16px 24px rgba(42,36,64,.22))`);
      if (k > 0 && k < 1) h += `<div style="position:absolute;left:${60 + k * SW - 40}px;top:${900 + SH * (.2 + .55 * Math.abs(Math.sin(t * 7)))}px;font-size:150px;transform:translate(-20%,-80%) rotate(-10deg)">✏️</div>`;
      h += stage('1. Розфарбовує ✏️', 1.8);
    }
    // 3.6–5.4 с: вирізає — ножиці їдуть по контуру, аркуш падає, деталь піднімається
    else if (t < 5.4) {
      const k = seg(t, 3.7, 4.8), drop = ease(seg(t, 4.8, 5.3));
      h += `<div style="position:absolute;left:30px;top:${830 + drop * 900}px;width:1020px;height:${SH + 140}px;background:#fff;border-radius:10px;box-shadow:0 20px 40px rgba(42,36,64,.18);transform:rotate(${-2 + drop * 12}deg);opacity:${1 - drop}"></div>`;
      h += side(60, 900 - drop * 40, 1, `transform:rotate(${-2 + drop * 4}deg) scale(${1 + drop * .05});filter:drop-shadow(0 ${8 + drop * 30}px ${10 + drop * 20}px rgba(42,36,64,.3))`);
      // ножиці по периметру деталі (прямокутник із заокругленням)
      if (k > 0 && k < 1) {
        const L = 2 * (SW + SH), d = k * L;
        let x, y, r;
        if (d < SW) { x = d; y = SH * .05; r = 0; } else if (d < SW + SH) { x = SW; y = d - SW; r = 90; }
        else if (d < 2 * SW + SH) { x = SW - (d - SW - SH); y = SH * .95; r = 180; } else { x = 0; y = SH - (d - 2 * SW - SH); r = 270; }
        h += `<div style="position:absolute;left:${60 + x}px;top:${900 + y}px;font-size:120px;transform:translate(-50%,-50%) rotate(${r + Math.sin(t * 40) * 12}deg)">✂️</div>`;
      }
      h += stage('2. Вирізає ✂️', 3.6);
    }
    // 5.4–7.2 с: склеює — боковини й стрічка-дах з'їжджаються, спалах → 3D
    else if (t < 7.2) {
      const k = easeIO(seg(t, 5.4, 6.2)), j = seg(t, 6.4, 6.6);
      const sw = SW * .62, sh = SH * .62;
      if (t < 6.6) {
        h += `<img src="${P}hip-strip-color.png" style="position:absolute;left:${540 - 1000 / 2}px;top:${1130 - 110 / 2 - (1 - k) * 420}px;width:1000px;height:110px;transform:rotate(${(1 - k) * -14}deg) scaleY(${1 - .5 * k});opacity:${1 - j}">`;
        h += `<img src="${P}hip-side-color.png" style="position:absolute;left:${540 - sw / 2 - (1 - k) * 700}px;top:${1130 - sh / 2 + 120}px;width:${sw}px;height:${sh}px;transform:rotate(${(1 - k) * -20}deg);opacity:${1 - j};filter:drop-shadow(0 12px 18px rgba(42,36,64,.25))">`;
        h += `<img src="${P}hip-side-color.png" style="position:absolute;left:${540 - sw / 2 + (1 - k) * 700}px;top:${1130 - sh / 2 + 150}px;width:${sw}px;height:${sh}px;transform:scaleX(-1) rotate(${(1 - k) * -20}deg);filter:brightness(.88) drop-shadow(0 12px 18px rgba(42,36,64,.25));opacity:${(1 - j) * .9}">`;
        if (k > .2) h += `<div style="position:absolute;left:${540 + Math.sin(t * 20) * 140}px;top:${1000}px;font-size:120px;transform:translate(-50%,-50%) rotate(20deg)">🧴</div>`;
      }
      if (t > 6.45) h += spin('hip', .1 + (t - 6.45) / 1.5, 540, 1130, 1150, pop(seg(t, 6.45, 6.85)));
      if (inside(t, 6.4, 6.7)) h += `<div style="position:absolute;inset:0;background:#fff;opacity:${1 - Math.abs(t - 6.5) / .2}"></div>`;
      h += stage('3. Склеює 🧴', 5.4);
    }
    // 7.2–8.6 с: готово
    else {
      h += spin('hip', .1 + .75 / 1.5 + (t - 7.2) / 3, 540, 1080, 1350, 1.05 + .05 * seg(t, 7.2, 8.6));
      h += confetti(t, 7.25, 540, 1000);
      h += cap(['Готово! 🙌', '40 хв без екрана'], 250, 80, { scale: pop(seg(t, 7.2, 7.55)), rot: -2, bg: 'var(--sun)' });
    }
    if (t < 8.6 && t >= 1.8) h += chip(`⏱ ${min} хв`, CX, 1350, 64, { center: true, bg: '#fff', fg: 'var(--ink)', scale: 1 + .08 * Math.max(0, Math.sin(t * Math.PI * 2)) });
    if (inside(t, 1.8, 7.2)) h += cap(['POV: без телефону 📵'], 250, 72, {});
    return h;
  },
};
</script>
</body>
</html>
