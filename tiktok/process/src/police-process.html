<!doctype html>

#world{position:absolute;left:0;top:0;transform-origin:0 0}
#world img,#world canvas{position:absolute;display:block}
.abs{position:absolute;left:0;top:0}
</style>
</head>

<div id="stage"><div id="bg"></div><div id="cam"><div id="world"></div></div><img id="v3" style="opacity:0"></div>
